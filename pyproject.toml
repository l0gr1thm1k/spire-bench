[project]
name = "spirebench"
version = "0.1.0"
description = "A shared, verifiable benchmark for Slay the Spire 2 bots: client library, gateway and headless-game workers."
authors = [{ name = "Daniel Smith" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "websockets>=17.4",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
