[project]
name = "spirebench"
version = "0.1.0"
description = "A shared, verifiable benchmark for Slay the Spire 2 bots: client library, gateway and headless-game workers."
authors = [{ name = "Daniel Smith" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
